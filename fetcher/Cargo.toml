[package]
name = "fetcher"
version = "0.10.1"
authors = ["Michael Aaron Murphy <mmstick@pm.me>"]
edition = "2018"
license = "MPL-2.0"

[dependencies]
async-fetcher = { path = "../" }
better-panic = "0.3.0"
fomat-macros = "0.3.2"
futures = "0.3.31"
is-terminal = "0.4.16"
pbr = "1.1.1"
ron = "0.11.0"
serde = { version = "1.0.225", features = ["derive"] }
thiserror = "2.0.16"
bytes = "1.10.1"
tokio-stream = "0.1.17"
async-shutdown = "0.2.2"
once_cell = "1.21.3"

[dependencies.tokio-util]
version = "0.7.16"
features = ["codec"]

[dependencies.tokio]
version = "1.47.1"
features = ["full"]
